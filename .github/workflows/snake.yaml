name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slow down and make snake grow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          SPEED_FACTOR = 2.5   # 1.0 = gốc, 2.5 = chậm hơn khá rõ
          GROW_FACTOR  = 1.28  # mức phình to lên

          rect_pattern = re.compile(
              r'<rect class="(s s\d+)" x="([\d.]+)" y="([\d.]+)" width="([\d.]+)" height="([\d.]+)" rx="([\d.]+)" ry="([\d.]+)"\s*/>'
          )

          for file in Path("dist").glob("*.svg"):
              text = file.read_text(encoding="utf-8")

              # 1) làm chậm toàn bộ animation
              text = re.sub(
                  r'(\d+)ms\b',
                  lambda m: f"{max(1, round(int(m.group(1)) * SPEED_FACTOR))}ms",
                  text
              )

              # lấy duration chính của snake sau khi đã làm chậm
              duration_match = re.search(
                  r'animation:\s*none\s+linear\s+(\d+)ms\s+infinite',
                  text
              )
              duration = duration_match.group(1) if duration_match else "15000"

              # 2) làm rắn "lớn dần" bằng animate width/height/x/y/rx/ry
              def repl(match):
                  cls = match.group(1)
                  x   = float(match.group(2))
                  y   = float(match.group(3))
                  w   = float(match.group(4))
                  h   = float(match.group(5))
                  rx  = float(match.group(6))
                  ry  = float(match.group(7))

                  new_w  = round(w * GROW_FACTOR, 1)
                  new_h  = round(h * GROW_FACTOR, 1)
                  dx     = round((new_w - w) / 2, 1)
                  dy     = round((new_h - h) / 2, 1)
                  new_x  = round(x - dx, 1)
                  new_y  = round(y - dy, 1)
                  new_rx = round(rx * GROW_FACTOR, 1)
                  new_ry = round(ry * GROW_FACTOR, 1)

                  return f'''<rect class="{cls}" x="{x:.1f}" y="{y:.1f}" width="{w:.1f}" height="{h:.1f}" rx="{rx:.1f}" ry="{ry:.1f}">
            <animate attributeName="width" values="{w:.1f};{new_w:.1f}" dur="{duration}ms" repeatCount="indefinite" />
            <animate attributeName="height" values="{h:.1f};{new_h:.1f}" dur="{duration}ms" repeatCount="indefinite" />
            <animate attributeName="x" values="{x:.1f};{new_x:.1f}" dur="{duration}ms" repeatCount="indefinite" />
            <animate attributeName="y" values="{y:.1f};{new_y:.1f}" dur="{duration}ms" repeatCount="indefinite" />
            <animate attributeName="rx" values="{rx:.1f};{new_rx:.1f}" dur="{duration}ms" repeatCount="indefinite" />
            <animate attributeName="ry" values="{ry:.1f};{new_ry:.1f}" dur="{duration}ms" repeatCount="indefinite" />
          </rect>'''

              text = rect_pattern.sub(repl, text)

              file.write_text(text, encoding="utf-8")
              print(f"Updated: {file}")

          PY

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}